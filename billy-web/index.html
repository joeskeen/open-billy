<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Billy — unofficial fan remake</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">OB</span>
          <div>
            <h1>Open Billy</h1>
            <p class="subtitle">unofficial fan remake</p>
          </div>
        </div>
        <div class="controls">
          <label class="field">
            <span data-i18n="language">Language</span>
            <select id="language">
              <option value="en">English</option>
              <option value="da">Dansk</option>
              <option value="eo">Esperanto</option>
            </select>
          </label>
          <label class="button file-button">
            <span data-i18n="load">Load level</span>
            <input id="level-file" type="file" accept=".K,.k" />
          </label>
          <button id="restart" class="button" type="button" data-i18n="restart">Restart</button>
        </div>
      </header>

      <section class="stage-wrap">
        <canvas id="game" width="800" height="600" aria-label="Open Billy playfield"></canvas>
        <div id="status" class="status" hidden></div>
      </section>

      <section class="hud" aria-live="polite">
        <div class="stat wide"><span data-i18n="world">World</span><strong id="world">Jungle</strong></div>
        <div class="stat wide"><span data-i18n="level">Level</span><strong id="level">demo</strong></div>
      </section>

      <section id="touch" class="touch" aria-label="Touch controls">
        <button type="button" data-bit="1" aria-label="Left">◀</button>
        <button type="button" data-bit="2" aria-label="Right">▶</button>
        <button type="button" data-bit="4" aria-label="Up">▲</button>
        <button type="button" data-bit="8" aria-label="Down">▼</button>
        <button type="button" data-bit="16" aria-label="Dig">⛏</button>
        <button type="button" data-bit="32" aria-label="Fill">▤</button>
      </section>

      <p class="note">
        This is an unofficial fan project. It is not affiliated with, endorsed by,
        or supported by Northwind Soft or any current rights holder. Original game
        assets are not included; load your own legal copy’s level files.
      </p>
      <p id="message" class="message" role="status"></p>
      <p class="build">build <span id="build">dev</span> · <span id="scale">1×</span></p>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
